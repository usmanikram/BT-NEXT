name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit lands on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint / Typecheck / Build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Dummy values so module-level checks (e.g. `lib/db.ts` throws if
    # DATABASE_URL is missing) don't crash the build. These never touch
    # a real database — the build only needs the env vars to exist.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=require
      AUTH_SECRET: ci-only-not-a-real-secret-aaaaaaaaaaaaaaaaaaaaaaaaa=
      AUTH_TRUST_HOST: "true"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
